name: pyoes

on:
  pull_request:

  push:
    branches:
      - master

permissions: {}

jobs:
  build:
    uses: OnroerendErfgoed/shared-workflows/.github/workflows/python-tests.yml@v1
    permissions:
      contents: read
      pull-requests: write # coverage comment
    with:
      runs-on: ubuntu-latest # public repo: no self-hosted runners
      lint-command: "" # the old workflow ran no linter
      # check_versions.sh: pyproject.toml and both package.json files have the same version
      test-command: |
        ./check_versions.sh
        pytest --cov pyoes --cov-report term-missing --cov-report xml:"$COVERAGE_XML"
      coverage-threshold-all: 0.9
      coverage-threshold-modified: 0.9
